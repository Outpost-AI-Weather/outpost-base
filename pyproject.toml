[project]
name = "outpost-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayaansethii", email = "ayaanmsethi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyserial>=3.5",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
outpost-base = "outpost_base:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
